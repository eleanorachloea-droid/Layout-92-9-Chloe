<!DOCTYPE html>
<html>
    <head>
        <title>Colspan dan Rowspan</title>
        <link rel="stylesheet" href="table_gabung.css">
    </head>
    <body>
        <h2>Colspan dan Rowspan pada Table</h2>
        <!-- colspan : menggabungkan kolom 
         rowspan : menggabungkan baris-->
        <tabel>
            <tr>
                <th rowspan="2">No</th>
                <th rowspan="2">Nama</th>
                <th colspan="2">Nilai</th>
            </tr>
            <tr>
                <th>Ulangan 1</th>
                <th>Ulangan 2</th>
            </tr>
            <tr> 
                <td>1</td>
                <td>Glori</td>
                <td>90</td>
                <td>92</td>
            </tr>
            <tr> 
                <td>2</td>
                <td>Jane</td>
                <td>80</td>
                <td>82</td>
            </tr>
            <tr> 
                <td>3</td>
                <td>Kayla</td>
                <td>91</td>
                <td>87</td>
            </tr>
            <tr> 
                <td>2</td>
                <td>Cili</td>
                <td>88</td>
                <td>92</td>
            </tr>
            <tr> 
                <td>5</td>
                <td>Sayla</td>
                <td>86</td>
                <td>82</td>
            </tr>
        </tabel>
    </body>
</html>
